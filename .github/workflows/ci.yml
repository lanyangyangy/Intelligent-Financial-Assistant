name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    name: Backend unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check app tests scripts eval
      - name: Unit tests (无 Docker 环境)
        run: pytest -m unit -q
      - name: Agent 离线评测（53 条确定性用例）
        run: python eval/run_eval.py --require-pass

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealth
          POSTGRES_PASSWORD: wealth_dev
          POSTGRES_DB: wealth_manager
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wealth -d wealth_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://wealth:wealth_dev@127.0.0.1:5433/wealth_manager
      REDIS_URL: redis://127.0.0.1:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed demo data (幂等)
        run: python scripts/seed_all.py --force
      - name: Integration tests
        run: pytest -m integration -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
